# Model Configuration for OLORIC

# Base model configuration
base_model:
  # Preferred candidate: Qwen3-class instruction model around 4B parameters
  name: "Qwen/Qwen3-4B-Instruct-2507"  # Will verify availability
  revision: "main"
  max_length: 2048  # Conservative sequence length for L4 24GB
  
  # Quantization settings for memory efficiency
  load_in_4bit: True
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: True
  bnb_4bit_quant_type: "nf4"

# LoRA/QLoRA adapter configuration
adapter:
  type: "lora"  # or "qlora" when combined with 4bit
  r: 16  # LoRA rank
  lora_alpha: 32  # LoRA scaling parameter
  lora_dropout: 0.05  # Dropout probability for LoRA layers
  target_modules:  # Modules to apply LoRA to
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"  # Bias training type
  task_type: "CAUSAL_LM"

# Training configuration
training:
  output_dir: "./checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 1  # Micro batch size
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4  # Effective batch size = 1 * 4 = 4
  gradient_checkpointing: True  # Save memory at cost of computation
  optim: "paged_adamw_8bit"
  learning_rate: 2e-4
  weight_decay: 0.01
  max_grad_norm: 0.3
  warmup_ratio: 0.03  # Preserved for documentation; training.py converts to warmup_steps
  lr_scheduler_type: "cosine"
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 3
  fp16: False  # Use bf16 with 4bit instead
  bf16: True
  tf32: True
  dataloader_pin_memory: False
  dataloader_num_workers: 0

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "fluency", "adherence"]
  generation:
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.9
    do_sample: True
    pad_token_id: null  # Will be set to eos_token_id

# Special tokens (if needed)
special_tokens:
  pad_token: "<pad>"
  bos_token: "<s>"
  eos_token: "</s>"
  unk_token: "<unk>"

# Memory configuration (for future Oloric Memory feature)
memory:
  enable_memory_candidate: True
  memory_title_max_length: 100
  memory_content_max_length: 2000
